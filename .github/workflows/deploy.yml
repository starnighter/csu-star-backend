# 后端 CD：push 到 main 后 SSH 源站执行 deploy.sh
name: Deploy Backend

on:
  push:
    branches:
      - main

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/csu-star-backend
            chmod +x deploy.sh
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
            ./deploy.sh
